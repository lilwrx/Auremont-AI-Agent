server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → FastAPI backend (^~ stops location search)
    location ^~ /api/ {
        proxy_pass         http://ai20k_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback - all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html has no content hash in its filename, unlike the JS/CSS it references (Vite
    # names those with a content hash, so those are safe to cache forever) — without this,
    # browsers can heuristically cache index.html itself with no explicit Cache-Control
    # header, silently serving a stale build (old bundle references) after a rebuild until
    # the user hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
