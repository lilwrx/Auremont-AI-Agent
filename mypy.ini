[mypy]
python_version = 3.11
ignore_missing_imports = False
warn_unused_ignores = True

# Neither package ships type information. Silencing the import error is the only option
# short of maintaining stubs for them; their call sites stay type-checked as `Any`.
[mypy-fitz.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-fastembed.*]
ignore_missing_imports = True

# numpy ships stubs written with 3.12-only syntax (PEP 695 `type` statements), which mypy
# cannot parse while targeting 3.11 above — it aborts the whole run before checking any of
# our own code. Skipping the stub bodies costs us numpy-typed call sites (they degrade to
# Any) and buys back type checking for the entire backend.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
