[pytest]
testpaths = tests

# pytest-asyncio is installed but was never configured, so every `async def test_`
# was being SKIPPED silently rather than failing. `auto` makes them run.
asyncio_mode = auto

# Deliberately no `log_level` here: it calls setLevel() globally and would mask
# the tests that assert on levels. Use caplog.at_level() per test instead.
